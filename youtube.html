<body class="sim-theater-body">

<div class="sim-theater-container">

  <!-- TOP FLOATING BAR (STORIES / THEATER STYLE) -->
  <div class="sim-top-bar">
    <!-- Progress Bar at very top -->
    <div class="sim-story-progress-bar">
      <div class="sim-story-progress-fill" id="sim-top-progress-fill" style="background:linear-gradient(90deg, #ff8080, #ff0000);"></div>
    </div>

    <!-- Main Controls Row -->
    <div class="sim-controls-row">
      <!-- 100% Reliable Exit Link -->
      <a href="index.html" class="sim-btn-exit" onclick="if(window.Voice)Voice.stop();" title="Thoát về Trang Chủ">
        <span class="icon">←</span>
        <span>Thoát</span>
      </a>

      <!-- Step Title & Badge -->
      <div class="sim-title-pill">
        <span class="sim-badge-tag" id="sim-badge" style="background:rgba(255,0,0,0.25); color:#ff4d4d; border-color:#ff0000;">Bước 1 / 5</span>
        <div class="sim-step-caption" id="sim-title">Bước 1: Chạm vào biểu tượng YouTube nút phát màu đỏ để mở</div>
      </div>

      <!-- Right Actions -->
      <div class="sim-actions-group">
        <button class="sim-act-btn sim-btn-pause" id="sim-btn-play" style="background:#ff0000; border-color:#ff0000; color:white;" onclick="sim.togglePlay()">
          <span>⏸ Tạm Dừng</span>
        </button>
        <button class="sim-act-btn" onclick="sim.replayVoice()" title="Nghe lại lời hướng dẫn">
          <span>🔊</span>
        </button>
        <button class="sim-act-btn" onclick="sim.next()" title="Sang bước tiếp theo">
          <span>▶</span>
        </button>
      </div>
    </div>
  </div>

  <!-- MAXIMIZED STAGE -->
  <div class="sim-theater-stage">
    <div class="sim-phone" style="box-shadow: 0 0 50px rgba(255, 0, 0, 0.35);">
      <div class="sim-notch">
        <div class="sim-speaker"></div>
        <div class="sim-camera"></div>
      </div>

      <!-- FINGER POINTER -->
      <div class="sim-finger" id="sim-finger">
        <div class="sim-finger-pulse"></div>
        <div class="sim-finger-hand">👆</div>
      </div>

      <!-- SIMULATED MOBILE SCREEN -->
      <div class="sim-screen" id="sim-screen" title="Chạm vào màn hình để sang bước tiếp theo">
        <!-- RENDERED BY SIMULATOR.JS -->
      </div>
    </div>
  </div>

</div>

<script src="js/voice.js"></script>
<script src="js/simulator.js"></script>
