<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#fe2c55">
  <title>Mô Phỏng TikTok - Hướng Dẫn Cho Ông Bà</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app-simulation.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="sim-theater-body">

<div class="sim-theater-container">

  <!-- TOP FLOATING CONTROLLER BAR -->
  <div class="sim-top-bar" style="border-bottom-color: rgba(254, 44, 85, 0.4);">
    <div class="sim-top-left">
      <button class="sim-ctrl-btn btn-exit-home" onclick="sim.exit()" title="Thoát ra Trang Chủ">
        <span>✕</span> <span>Thoát</span>
      </button>
      <button class="sim-ctrl-btn btn-pause-toggle" id="sim-btn-play" style="background:#fe2c55; color:white;" onclick="sim.togglePlay()">
        <span>⏸</span> <span>Tạm Dừng</span>
      </button>
    </div>

    <div class="sim-top-title-box">
      <span class="sim-step-tag" id="sim-badge" style="background:#fe2c55; color:white;">Bước 1 / 4</span>
      <div class="sim-step-text" id="sim-title">Bước 1: Chạm vào biểu tượng TikTok nốt nhạc để mở</div>
    </div>

    <div style="display:flex; gap:6px;">
      <button class="sim-ctrl-btn btn-voice-replay" onclick="sim.replayVoice()" title="Nghe lại lời hướng dẫn">
        <span>🔊</span> <span>Nghe Lại</span>
      </button>
      <button class="sim-ctrl-btn btn-voice-replay" onclick="sim.next()" title="Sang bước tiếp theo">
        <span>Tiếp ▶</span>
      </button>
    </div>

    <!-- Countdown Progress Fill -->
    <div class="sim-top-progress-track">
      <div class="sim-top-progress-fill" id="sim-top-progress-fill" style="background:linear-gradient(90deg, #25f4ee, #fe2c55);"></div>
    </div>
  </div>

  <!-- MAXIMIZED STAGE -->
  <div class="sim-theater-stage">
    <div class="sim-phone" style="box-shadow: 0 0 50px rgba(254, 44, 85, 0.35);">
      <div class="sim-notch">
        <div class="sim-speaker"></div>
        <div class="sim-camera"></div>
      </div>

      <!-- FINGER POINTER -->
      <div class="sim-finger" id="sim-finger">
        <div class="sim-finger-pulse"></div>
        <div class="sim-finger-hand">👆</div>
      </div>

      <!-- SIMULATED MOBILE SCREEN -->
      <div class="sim-screen" id="sim-screen" title="Chạm vào màn hình để sang bước tiếp theo">
        <!-- RENDERED BY SIMULATOR.JS -->
      </div>
    </div>
  </div>

</div>

<script src="js/voice.js"></script>
<script src="js/simulator.js"></script>

// AUTO START ON LOAD
let sim;
document.addEventListener('DOMContentLoaded', function() {
  sim = new AppSimulator({
    screenId: 'sim-screen',
    steps: TT_SIMULATION_STEPS,
    defaultDuration: 5500,
    autoStart: true

});
</script>
</body>
</html>
